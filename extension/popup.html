<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>HackMirror 批量取关</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #111;
        --body: #555;
        --line: #e5e5e5;
        --bg: #fff;
        --soft: #f6f6f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f5f5f5;
          --body: #a3a3a3;
          --line: #2a2a2a;
          --bg: #111;
          --soft: #1a1a1a;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 380px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 { margin: 0 0 8px; font-size: 16px; }
      p { margin: 0 0 10px; color: var(--body); }
      textarea {
        width: 100%;
        height: 150px;
        padding: 8px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        color: var(--ink);
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .row { display: flex; gap: 8px; margin-top: 10px; }
      button {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--soft);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      #status { margin-top: 10px; min-height: 18px; color: var(--body); font-size: 12px; }
      .warn { color: #b45309; }
    </style>
  </head>
  <body>
    <h1>HackMirror 批量取关</h1>
    <p>在 HackMirror 勾选账号 → 点「复制取关清单」→ 粘贴到下面 → 开始。</p>
    <textarea id="list" placeholder='[{"id":"123","handle":"someone"}]' spellcheck="false"></textarea>
    <div class="row">
      <button id="paste" type="button">从剪贴板粘贴</button>
      <button id="clear" type="button">清空</button>
    </div>
    <div class="row">
      <button id="start" class="primary" type="button">开始取关</button>
      <button id="stop" type="button">停止</button>
    </div>
    <div id="status"></div>
    <p class="warn" style="margin-top:10px">
      ⚠ 自动化操作可能触发 X 风控或限流，建议每次不超过 50 个。运行中按 Esc 可停止。
    </p>
    <script src="popup.js"></script>
  </body>
</html>
